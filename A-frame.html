<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Práctica VR Ciudad 360</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>

      <a-assets>
        <a-asset-item id="modeloPlaneta" src="planet collision 3d model.glb"></a-asset-item>
        <a-asset-item id="icePlanet" src="ice planet 3d model.glb"></a-asset-item>
        <a-asset-item id="spacePlanet" src="space planet 3d model.glb"></a-asset-item>
      </a-assets>

      <a-sky src="Solarsystemscope_texture_2k_stars.jpg"></a-sky>

      <a-sphere 
        position="0 0 -3"
        radius="0.6"
        segments-width="30"
        segments-height="30"
        src="2k_mercury.jpg"
        animation="property: rotation; to: 360 360 360; loop: true; dur: 7000; easing: linear">
      </a-sphere>

      <a-sphere 
        position="-2.5 0 -2.5"
        radius="0.6"
        segments-width="30"
        segments-height="30"
        src="2k_mercury.jpg"
        animation="property: rotation; to: 360 360 360; loop: true; dur: 12000; easing: linear">
      </a-sphere>

      <a-sphere 
        position="2.5 0 -2.5"
        radius="0.6"
        segments-width="30"
        segments-height="30"
        src="2k_mercury.jpg"
        animation="property: rotation; to: 360 360 360; loop: true; dur: 8000; easing: linear">
      </a-sphere>

      <a-sphere 
        position="-3 0 0"
        radius="0.6"
        segments-width="30"
        segments-height="30"
        src="2k_mercury.jpg"
        animation="property: rotation; to: 360 360 360; loop: true; dur: 11000; easing: linear">
      </a-sphere>

      <a-sphere 
        position="3 0 0"
        radius="0.6"
        segments-width="30"
        segments-height="30"
        src="2k_mercury.jpg"
        animation="property: rotation; to: 360 360 360; loop: true; dur: 9000; easing: linear">
      </a-sphere>

      <a-sphere 
        position="-2.5 0 2.5"
        radius="0.6"
        segments-width="30"
        segments-height="30"
        src="2k_mercury.jpg"
        animation="property: rotation; to: 360 360 360; loop: true; dur: 13000; easing: linear">
      </a-sphere>

      <a-sphere 
        position="0 0 3"
        radius="0.6"
        segments-width="30"
        segments-height="30"
        src="2k_mercury.jpg"
        animation="property: rotation; to: 360 360 360; loop: true; dur: 10500; easing: linear">
      </a-sphere>

      <a-sphere 
        position="2.5 0 2.5"
        radius="0.6"
        segments-width="30"
        segments-height="30"
        src="2k_mercury.jpg"
        animation="property: rotation; to: 360 360 360; loop: true; dur: 11500; easing: linear">
      </a-sphere>

      <a-entity camera look-controls></a-entity>
    </a-scene>
  </body>
</html>
